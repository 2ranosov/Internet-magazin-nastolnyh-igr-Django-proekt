{% extends 'shop/base.html' %}

{% block title %}Каталог{% endblock %}

{% block content %}
    <h1>Каталог игр</h1>
    <div class="catalog">
        {% for game in games %}
            <article class="card">
                <h2>{{ game.name }}</h2>
                <p>{{ game.description }}</p>
                <p><strong>{{ game.price }} ₽</strong></p>
            </article>
        {% endfor %}
    </div>
    <p>Цены приведены для примера. Покупки на учебном сайте не оформляются.</p>
{% endblock %}
