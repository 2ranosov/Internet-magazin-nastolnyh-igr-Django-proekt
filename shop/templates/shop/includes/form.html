<h2>Добавить запись</h2>
<form method="post" novalidate>
    {% csrf_token %}
    {% if form.errors %}<p class="error" role="alert">Запись не сохранена. Исправьте ошибки ниже.</p>{% endif %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <div class="form-field">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}
    <button type="submit">Добавить</button>
</form>
