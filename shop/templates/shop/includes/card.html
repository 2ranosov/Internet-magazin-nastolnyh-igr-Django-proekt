<article class="game-card">
  <div class="game-art {{ game.art }}" aria-hidden="true"><span class="art-orbit"></span><span class="art-symbol">{{ game.symbol }}</span><span class="box-title">{{ game.name }}</span><span class="box-caption">НАСТОЛЬНАЯ ИГРА</span></div>
  <div class="card-body"><span class="category">{{ game.category }}</span><h3>{{ game.name }}</h3><p>{{ game.description }}</p><div class="game-meta"><span>{{ game.players }} игроков</span><span>{{ game.time }} мин</span><span>{{ game.age }}</span></div><div class="card-bottom"><strong>{{ game.price }} ₽</strong><span>{{ game.tag }}</span></div></div>
</article>
